name: Complex Workflow
description: Provides examples of job and step differences. Shows also how to pass information between steps within a job and between jobs.

on: [workflow_dispatch]              # Allows triggering the workflow manually

jobs:                                # jobs are executed independently by default (in parallel)
  build-first:
    runs-on: ubuntu-24.04
    steps:                           # steps are executed sequentially on the same runner; they share data;
      - name: Step 1
        id: buildFirstStep1                    # Define a step id (necessary to refer to this specific step) 
        run: |
          echo "Executing step 1 of build-first..."
          echo "output1=ABCDE" >> $GITHUB_OUTPUT
          echo "output2=12345" >> $GITHUB_OUTPUT
      - name: Step 2
        env:
          PREVIOUS_STEP_OUTPUT_1: ${{steps.buildFirstStep1.outputs.output1}}  # A step might rely on previous steps' output
          PREVIOUS_STEP_OUTPUT_2: ${{steps.buildFirstStep1.outputs.output2}}
        run: |
          echo "::group::Step 2 logs"
          echo "Executing step 2 of build-first..."
          echo "Previous step output1: ${PREVIOUS_STEP_OUTPUT_1}"
          echo "Previous step output2: ${PREVIOUS_STEP_OUTPUT_2}"
          echo "::endgroup::"
  build-second:
    runs-on: ubuntu-24.04
    outputs:
      output1: ${{steps.stepId.outputs.myValue}}    # Bind a specific step output to the job's output
    steps:
      - name: Step 1
        id: stepId
        run: echo "myValue=12345" >> $GITHUB_OUTPUT
  test:
    runs-on: ubuntu-24.04
    needs:                            # With "needs", we can tell a job that it has to wait for other jobs to complete (e.g., to use their output)
      - build-first
      - build-second
    env:
      BUILD_SECOND_OUTPUT: ${{needs.build-second.outputs.output1}}    # Use a sepcifc job's output
    steps:
      - name: Run test after build
        run: |
          echo "::group::Test logs"
          echo "Executing tests after build-first and build-second..."
          echo "Accessing job 'build-second' output: ${BUILD_SECOND_OUTPUT}"
          echo "::endgroup::"
    
