name: Invoke scripts workflow

on: [workflow_dispatch]              # Allows triggering the workflow manually

jobs:
  invoke-script-job:
    runs-on: ubuntu-24.04
    defaults:                        # Defines defaults for the current job
      run:
        working-directory: .github/scripts/examples # Sets working directory for all "run" in the current job; needed to tell the workflow where to look for the scripts
    steps:
      - name: Run a script
        run: ./script1.sh
